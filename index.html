<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vimal Vyapar PRO</title>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background-color: #000000; color: #ffffff; }
      * { box-sizing: border-box; }
      a { text-decoration: none; color: #38bdf8; }
      .btn-primary { background: #eab308; color: #000; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
      .btn-primary:hover { background: #ca8a04; }
      .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
      .btn-danger { background: #ef4444; color: #fff; padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;}
      .btn-success { background: #22c55e; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;}
      .btn-success:hover { background: #16a34a; }
      .btn-success:disabled { opacity: 0.6; cursor: not-allowed; }
      .btn-outline { background: transparent; color: #38bdf8; border: 1px solid #38bdf8; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;}
      input, select { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #333; border-radius: 6px; background: #111; color: #fff; font-size: 16px; }
      input:focus, select:focus { outline: 2px solid #38bdf8; }
      .card { background: #111; padding: 24px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-bottom: 20px; }
      .table-container { overflow-x: auto; background: #111; border-radius: 12px; border: 1px solid #333; padding: 16px; margin-bottom: 20px;}
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 16px; text-align: left; border-bottom: 1px solid #222; }
      th { color: #eab308; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
      .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
      .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
      .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px; }
      
      @media print {
        body { background-color: #ffffff !important; color: #000000 !important; margin: 0; padding: 0; }
        .no-print { display: none !important; }
        .print-section { 
          display: block !important; 
          position: absolute; 
          left: 0; 
          top: 0; 
          width: 100%; 
          background: #ffffff !important; 
          color: #000000 !important; 
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
